name: Release and Tag

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Notify Slack - Build Started
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚀 iOS SDK Build Started",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 iOS SDK Build Started"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Commit: <${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Get version from SDKVersion.swift
        id: get_version
        run: |
          # Extract version from SDKVersion.swift
          VERSION=$(grep -o 'version = "[^"]*"' Sources/NeuralNodesInbox/SDKVersion.swift | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version from SDKVersion.swift: $VERSION"
      
      - name: Check if version changed
        id: version_changed
        run: |
          # Check if SDKVersion.swift was modified in this commit
          if git diff --name-only HEAD~1 HEAD | grep -q "Sources/NeuralNodesInbox/SDKVersion.swift"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ SDKVersion.swift was modified in this commit"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ SDKVersion.swift was not modified, skipping release"
          fi
      
      - name: Check if tag exists
        id: check_tag
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v$VERSION already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag v$VERSION does not exist, proceeding with release"
          fi
      
      - name: Validate Swift Package
        run: |
          echo "🔍 Validating Swift Package..."
          
          # Resolve dependencies
          xcodebuild -resolvePackageDependencies
          
          # Validate Package.swift structure
          swift package dump-package > /dev/null
          
          echo "✅ Package validation completed successfully"
      
      - name: Build and validate
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        run: |
          echo "🔨 Building Swift Package for iOS..."
          
          # Build for iOS simulator (arm64 and x86_64)
          xcodebuild -scheme NeuralNodesInbox \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            clean build
          
          echo "✅ Build completed successfully"
          echo "📦 Swift Package is ready for distribution"
      
      - name: Create Git tag
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
      
      - name: Generate changelog
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save to file for GitHub release
          echo "$CHANGELOG" > CHANGELOG.txt
          
          echo "Changelog generated"
      
      - name: Create GitHub Release
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post-release summary
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.version }} created successfully!"
          echo ""
          echo "📦 Installation instructions:"
          echo ""
          echo "Add to your Package.swift:"
          echo ""
          echo "dependencies: ["
          echo "    .package(url: \"https://github.com/${{ github.repository }}.git\", from: \"${{ steps.get_version.outputs.version }}\")"
          echo "]"
          echo ""
          echo "Or in Xcode:"
          echo "File > Add Package Dependencies > Enter: https://github.com/${{ github.repository }}.git"
      
      - name: Validation-only summary
        if: steps.version_changed.outputs.changed == 'false'
        run: |
          echo "✅ Package validation passed!"
          echo "ℹ️ No version change detected, skipping release"
          echo "📦 To create a release, update version in Sources/NeuralNodesInbox/SDKVersion.swift"
      
      - name: Notify Slack - Build Success
        if: success() && steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ iOS SDK Build Completed Successfully",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ iOS SDK Build Completed Successfully"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\nv${{ steps.get_version.outputs.version }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Installation:*\n```dependencies: [\n    .package(url: \"https://github.com/${{ github.repository }}.git\", from: \"${{ steps.get_version.outputs.version }}\")\n]```"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Commit"
                      },
                      "url": "${{ github.event.head_commit.url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Notify Slack - Build Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ iOS SDK Build Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ iOS SDK Build Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Logs"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
