name: Validate Build

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches-ignore:
      - main
      - master

jobs:
  validate:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build package
        run: |
          # Resolve dependencies
          xcodebuild -resolvePackageDependencies
          
          # Build for iOS using xcodebuild with the package
          xcodebuild build \
            -scheme NeuralNodesInbox-Package \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Run tests
        run: |
          echo "⚠️ No tests configured"
      
      - name: Validate Package.swift
        run: |
          swift package dump-package > /dev/null
          echo "✅ Package.swift is valid"
      
      - name: Check for version conflicts
        run: |
          # Ensure SDKVersion.swift exists and has valid version
          if [ ! -f "Sources/NeuralNodesInbox/SDKVersion.swift" ]; then
            echo "❌ SDKVersion.swift not found"
            exit 1
          fi
          
          VERSION=$(grep -o 'version = "[^"]*"' Sources/NeuralNodesInbox/SDKVersion.swift | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "❌ Version not found in SDKVersion.swift"
            exit 1
          fi
          
          echo "✅ Version: $VERSION"
      
      - name: Build summary
        run: |
          echo "✅ Build validation passed!"
          echo "📦 Package is ready for release"
